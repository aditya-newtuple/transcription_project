services:
  bot-api-service:
    image: bot-api-service:dev
    container_name: bot-api-service-dev
    build:
      context: ./bot_service
      dockerfile: ./dockerfiles/api.Dockerfile
    env_file:
      - ./bot_service/src/backend/etc/.env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SQLALCHEMY_DATABASE_MIGRATION_URL=${SQLALCHEMY_DATABASE_MIGRATION_URL:-postgresql://root:root@pg-database:5432/transcriber_local_db}
    volumes:
      - ./bot_service/src/backend/etc:/app/backend/etc
    healthcheck:
      test: curl --fail http://localhost:8081/v1/api/health || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    ports:
      - 8085:8081
    networks:
      - shared_network
      - llm-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      pg-database:
        condition: service_healthy

  bot-worker-service:
    image: bot-api-service:dev
    container_name: bot-worker-service-dev
    working_dir: /app/backend
    command: ["python", "-m", "worker"]  # or "python", "worker.py"
    env_file:
      - ./bot_service/src/backend/etc/.env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RQ_WORKER_QUEUES=transcribe
      - SQLALCHEMY_DATABASE_MIGRATION_URL=${SQLALCHEMY_DATABASE_MIGRATION_URL:-postgresql://root:root@pg-database:5432/transcriber_local_db}
    volumes:
      - ./bot_service/src/backend/etc:/app/backend/etc
    networks:
      - shared_network
      - llm-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      pg-database:
        condition: service_healthy

  bot-ui-service:
    image: bot-ui-service:dev
    container_name: bot-ui-service-dev
    build:
      context: ./bot_service
      dockerfile: ./dockerfiles/ui.Dockerfile
    env_file:
      - ./bot_service/src/frontend/.env
    healthcheck:
      test: curl --fail http://localhost:3000 || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    ports:
      - "3001:3000"
    networks:
      - shared_network
    dns:
      - 8.8.8.8
    restart: "unless-stopped"
    command: ["serve", "-s", "dist", "-l", "3000"]
    depends_on:
      - bot-api-service

networks:
  shared_network:
    external: true
  llm-network:
    external: true
